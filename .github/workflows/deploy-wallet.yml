# Continuous release of the wallet SPA (apps/wallet-web) to Vercel, built on the
# dev box's dedicated deploy clone (/home/a41/bongtu-deploy). The build MUST run
# on this box — the wallet imports unbuilt @bongtu/* workspace source, so
# `vercel build` needs the whole monorepo (npm workspaces) as context; only the
# prebuilt .vercel/output is uploaded (`vercel deploy --prebuilt`). Runs on the
# box's own self-hosted runner as pure shell — no actions/checkout, no secrets
# (the box's Vercel CLI login is ambient in ~/.local/share/com.vercel.cli).
name: deploy-wallet

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Deliberately narrow (user decision): only the app and the workspace
    # packages it imports fire a deploy. A root lockfile/tsconfig bump does NOT
    # auto-deploy — use workflow_dispatch for those rare cases.
    paths:
      - "apps/wallet-web/**"
      - "packages/**"
      - ".github/workflows/deploy-wallet.yml"

jobs:
  deploy:
    runs-on: [self-hosted, bongtu-devbox]
    env:
      # The runner's minimal PATH has no node; the box's toolchain (node, npm,
      # vercel) lives in the nvm-managed bin.
      PATH: /home/a41/.nvm/versions/node/v22.17.1/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Sync deploy clone to origin/main
        run: |
          cd /home/a41/bongtu-deploy
          git fetch origin main
          git reset --hard origin/main
      - name: Install workspace dependencies
        run: |
          cd /home/a41/bongtu-deploy
          npm ci
      - name: Guard - proving assets present AND matching the committed pin
        run: |
          # public/circuits (wasm+zkey) is gitignored box state, seeded into the
          # deploy clone out of band (bongtu regen recipe). Presence alone is not
          # enough: after a circuit regen the committed CIRCUITS_VERSION bumps but
          # this out-of-band seed is the easiest step to forget — shipping STALE
          # zkeys under the new cache bucket, and every browser prove then fails
          # on-chain with no pipeline signal. So verify identity, not existence:
          # the pin is first-8 sha256 over the three zkeys (src/config.ts recipe).
          cd /home/a41/bongtu-deploy/apps/wallet-web
          for f in public/circuits/transfer.wasm public/circuits/withdraw.wasm public/circuits/deposit.wasm; do
            test -s "$f" || { echo "missing proving asset: $f" >&2; exit 1; }
          done
          pinned=$(grep -oE 'CIRCUITS_VERSION = "[0-9a-f]+"' src/config.ts | grep -oE '[0-9a-f]{8}')
          actual=$(cat public/circuits/transfer.zkey public/circuits/withdraw.zkey public/circuits/deposit.zkey | sha256sum | cut -c1-8)
          if [ "$pinned" != "$actual" ]; then
            echo "zkey seed does not match CIRCUITS_VERSION: pinned=$pinned actual=$actual" >&2
            echo "re-seed public/circuits in the deploy clone from the regenerated zkeys" >&2
            exit 1
          fi
          echo "proving assets match pin $pinned"
      - name: Build locally and deploy prebuilt output
        run: |
          cd /home/a41/bongtu-deploy/apps/wallet-web
          # The clone is linked once, out of band, to fractalyze/bongtu-wallet
          # (its .vercel/ is untracked and survives the reset --hard above).
          # pull refreshes project settings; build runs Vite against the monorepo
          # (installCommand "" in vercel.json — deps come from npm ci above).
          vercel pull --yes --environment production
          vercel build --prod
          vercel deploy --prebuilt --prod
      - name: Verify production serves the app and the indexer rewrite
        run: |
          curl -fsS -o /dev/null -w 'root %{http_code}\n' https://bongtu-wallet-orcin.vercel.app/
          curl -fsS https://bongtu-wallet-orcin.vercel.app/indexer/health | grep -q '"ok": *true'
          echo "wallet + /indexer rewrite healthy"
