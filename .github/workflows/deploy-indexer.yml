# Continuous release of the indexer stack onto the dev box's dedicated deploy
# clone (/home/a41/bongtu-deploy). Runs on the box's own self-hosted runner, so
# the job is pure shell against that clone — no actions/checkout, no secrets
# here (AUTHORITY_KEY/RPC live only in the deploy clone's gitignored
# .env.compose).
name: deploy-indexer

on:
  workflow_dispatch:
  push:
    branches: [main]
    # The filter must cover the indexer image's full build-context input set
    # (every Dockerfile COPY source + .dockerignore) — a root lockfile bump or a
    # pool-address rewrite must redeploy, not silently keep serving a stale image.
    paths:
      - "apps/indexer/**"
      - "packages/core/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - "deploy/addresses.91342.json"
      - ".dockerignore"
      - ".github/workflows/deploy-indexer.yml"

jobs:
  deploy:
    runs-on: [self-hosted, bongtu-devbox]
    steps:
      - name: Sync deploy clone to origin/main
        run: |
          cd /home/a41/bongtu-deploy
          git fetch origin main
          git reset --hard origin/main
      - name: Rebuild and restart the compose stack
        run: |
          cd /home/a41/bongtu-deploy
          docker compose --env-file .env.compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8600/health | grep -q '"ok": *true'; then
              echo "indexer healthy"
              exit 0
            fi
            sleep 3
          done
          echo "indexer did not become healthy within 90s" >&2
          curl -fsS localhost:8600/health || true
          exit 1
