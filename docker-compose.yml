# bongtu read-side stack (U-I3): postgres + indexer. The prover (GPU) and the
# static web apps are deliberately NOT here — this is the availability layer.
#
#   docker compose up --build                 # defaults: reads a host anvil on
#                                             # :8545 via host.docker.internal
#   docker compose --env-file .env.compose up # override RPC / POOL / AUTHORITY_KEY
#                                             #   (cp .env.compose.example .env.compose)
#
# Knobs come from the shell / --env-file via ${VAR:-default} interpolation (see
# .env.compose.example). DATABASE_URL is derived here to point at the postgres
# service; the indexer applies schema.sql on boot (idempotent) and RESUMES from
# its block cursor across restarts (the named pgdata volume survives `up`/`down`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bongtu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bongtu}
      POSTGRES_DB: ${POSTGRES_DB:-bongtu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # gate the indexer's start on a ready DB (accepting connections), not just a
      # running container.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bongtu} -d ${POSTGRES_DB:-bongtu}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # host.docker.internal resolves to the docker host on Linux via host-gateway,
    # so the default RPC reaches an anvil running on the host at :8545.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Postgres backend (persist + boot-resume): points at the postgres service.
      DATABASE_URL: postgres://${POSTGRES_USER:-bongtu}:${POSTGRES_PASSWORD:-bongtu}@postgres:5432/${POSTGRES_DB:-bongtu}
      # Read-side knobs — override via --env-file .env.compose or the shell.
      RPC: ${RPC:-http://host.docker.internal:8545}
      # Empty POOL => the indexer falls back to deploy/addresses.<CHAIN_ID>.json
      # (baked into the image; 91342 = the live GIWA pool).
      POOL: ${POOL:-}
      CHAIN_ID: ${CHAIN_ID:-91342}
      START_BLOCK: ${START_BLOCK:-0}
      POLL_MS: ${POLL_MS:-5000}
      LOG_CHUNK: ${LOG_CHUNK:-50000}
      # AUTHORITY_KEY set => ARBITER MODE (institution-internal; holds every
      # owner's decrypted notes). Leave empty for a public indexer.
      AUTHORITY_KEY: ${AUTHORITY_KEY:-}
      # The ML-KEM-768 decapsulation key (hybrid envelopes). Arbiter mode on a
      # KEM-epoch pool REFUSES to boot without it (kemBootGuard, design §7).
      AUTHORITY_KEM_KEY: ${AUTHORITY_KEM_KEY:-}
      # /auth view tokens (arbiter mode): HMAC secret — unset means a per-boot
      # secret and every wallet login dies on restart, so pin it in .env.compose.
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      # Origin(s) wallets DIAL for reads. Behind the same-origin /indexer proxy
      # that is the WALLET apps' origins, not this host's (README `PUBLIC_URL`).
      PUBLIC_URL: ${PUBLIC_URL:-}
      PORT: "8600"
    ports:
      - "${INDEXER_PORT:-8600}:8600"
    restart: unless-stopped

volumes:
  pgdata:
