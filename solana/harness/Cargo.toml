# Mollusk gate harness (SOLR §3.1.3 / §5.1): per-instruction SVM execution
# with exact CU metering — the forge-test analogue for the Solana rail.
# The solana-* dependency majors track what mollusk-svm 0.15.1 itself uses,
# so Instruction/Account/Pubkey types unify with the harness API.
[package]
name = "bongtu-solana-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bongtu-pool-solana = { path = "../program", features = ["no-entrypoint"] }
mollusk-svm.workspace = true
# SPL token program ELF for the escrow-motion gates (deposit pull / withdraw
# push); token feature only — no token-2022, no ATA.
mollusk-svm-programs-token = { version = "=0.15.1", default-features = false, features = ["token"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3"
solana-pubkey = "4"
solana-poseidon.workspace = true
serde.workspace = true
serde_json.workspace = true
