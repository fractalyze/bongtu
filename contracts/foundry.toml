[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = true
# read ./test          : fixtures (poseidon2.hex, realproofs.json, disburse256.*) for tests + deploy scripts
# read-write ../deploy : Deploy.s.sol writes addresses.<chainid>.json there; Smoke.s.sol reads it back
fs_permissions = [
    { access = "read", path = "./test" },
    { access = "read-write", path = "../deploy" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
