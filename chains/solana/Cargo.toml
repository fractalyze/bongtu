# bongtu Solana rail — S2 program island (SOLR §2, §3.1).
# One cargo workspace: the on-chain program + the mollusk gate harness ship in
# the same commit (SOLR §3.1.3). SBF build via cargo-build-sbf (Agave release pinned as AGAVE_VERSION in .github/ci-pins.env,
# platform-tools v1.52); host tests use the rust-toolchain.toml pin.
[workspace]
resolver = "2"
members = ["program", "harness"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
solana-program = "=3.0.0"
solana-bn254 = "=3.2.1"
solana-poseidon = "=3.1.14"
mollusk-svm = "=0.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
