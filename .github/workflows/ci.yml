# bongtu CI — every gate a GitHub-hosted ubuntu runner can genuinely pass.
#
# INCLUDED
#   node-fast/-payroll/-wallet
#                        npm ci + typecheck (root cross-tree tsc + every workspace
#                        tsc) + unit tests (core, payroll-web, wallet-web) + the
#                        two vite builds.
#   indexer-units        the anvil-free indexer unit suite (tree + disclosure +
#                        ingest) in its own parallel job: it needs extdeps +
#                        a forge build (pool ABI), which would fatten the node
#                        job past the wall-time budget.
#   indexer-image        BUILD-ONLY docker build of apps/indexer/Dockerfile (the
#                        2-service compose image). A hosted runner CAN build the
#                        image (node base + a trimmed npm ci + external ethers +
#                        the committed pool ABI — no foundry, no GPU). It does NOT
#                        run `docker compose up` or the pg integration test: those
#                        need a live RPC + a deployed pool + CPU proofs and stay a
#                        LOCAL gate (apps/indexer/test/pg_integration.sh). One
#                        parallel `docker build` (~1-2 min), off the critical path.
#   forge                contracts: forge test + deploy/gates/deploy_local.sh (full
#                        B=256 stack deploy + smoke deposit on a self-contained
#                        anvil). forge-std is vendored under chains/evm/lib/ and
#                        all fixtures (poseidon2.hex, committed real Groth16
#                        proofs incl. disburse256) are in-tree — no network.
#   solana-mollusk       chains/solana/ program island (SOLR §3.1.3): cargo-build-sbf
#                        + the mollusk gate suite (poseidon conformance, verify
#                        parity vs committed realproof fixtures, tx-size, the
#                        invariant-gate rows, CU budgets). Fast lane, runs when
#                        chains/solana/ or the committed fixtures change. Self-contained:
#                        every fixture/vector is in-tree; the only network use
#                        is the pinned Agave toolchain install (AGAVE_VERSION
#                        in ci-pins.env).
#   prover-pytest        prover/ CPU-only unit gates (tests import pydantic +
#                        prover_service.{schema,calldata,config} — no jax /
#                        rabbitsnark / GPU). Deliberately does NOT run
#                        prover/setup.sh (it bridges into local GPU venvs).
#   circuits             artifact cache builder: on a cache HIT (circuit sources
#                        + pins unchanged — the typical push) it only verifies
#                        the cache exists (~20s, lookup-only). On a MISS it does
#                        the full from-scratch build: pinned circom release
#                        binary + pinned zeto checkout + circomlib + the Hermez
#                        pot22 ptau (sha256-pinned, 4.8 GB, cached, touched ONLY
#                        on this path), runs build/prove_all.sh, gates
#                        `git diff --exit-code circuits/verifiers` (drift can
#                        only appear when circuits change = exactly the miss
#                        path), runs the three CIRCUIT SOUNDNESS gates
#                        (test_zero_leaf_unsat.sh, assert_attacks_throw.ts,
#                        auditor_decrypt_check.ts), and saves circuits/out
#                        (~266 MB). The miss path is exactly when a circuit or a
#                        witness generator changed — the cache key hashes both,
#                        so those gates cannot be skipped by a stale artifact.
#                        The full pot22
#                        ptau is required (not a smaller one): the committed
#                        chains/evm/src/verifiers/*.sol derive from a pot22
#                        groth16 setup, and `snarkjs groth16 setup` is
#                        deterministic given (r1cs, ptau), so fresh zkeys
#                        produce proofs that verify against the committed
#                        on-chain verifiers — which is also why caching the
#                        built artifacts is sound.
#   e2e-m0               restores circuits/out and runs deploy/gates/e2e_m0.sh
#                        (anvil deposit -> disburse16 -> transfer -> withdraw,
#                        then the portal leg and the arbiter-free consumer leg:
#                        V3 module upgrade + CPU-proved consumer ops with kem
#                        chunk txs + a public indexer + self-scan discovery).
#   indexer-conformance  restores circuits/out and runs the indexer anvil
#                        scenarios incl. arbiter mode and the consumer
#                        (op-module) leg — module events, kem chunk transport,
#                        public batch fill — ingesting into a postgres
#                        service container (the indexer is Postgres-only, U-I4;
#                        TEST_DATABASE_URL makes run.sh use the service instead
#                        of spinning docker itself).
#
# LANES (2026-09-04): pull requests run the FAST lane only — the `changes`
# router skips every job whose inputs did not change, and the node job is
# split (node-fast / node-payroll / node-wallet) so the wall time is the
# slowest suite, not their sum. The HEAVY lane (circuits, e2e-m0,
# indexer-conformance) runs on pushes to main, on workflow_dispatch, and on
# PRs labeled `ci:heavy` — measured warm timings made the call: forge 33s,
# prover 14s, indexer-units 73s, e2e 2m43s/conformance 2m19s off a warm
# artifact cache, but a packages/core change re-keys the circuits cache into
# a ~12-min rebuild, which cannot fit the 5-minute PR budget.
#
# WALL-TIME BUDGET: on a typical push (circuits unchanged, caches warm) the
# circuits job is lookup-only and e2e-m0 / conformance run in parallel off the
# artifact cache. Those two carry the portal + consumer legs, so they — not the
# ~3 min node path — bound the wall time (timeout-minutes 25 each). A
# circuits/pins change pays the full rebuild (~10-12 min) once, then re-warms
# the cache.
#
# EXCLUDED — with the reason each cannot genuinely pass on a hosted runner
#   - disburse256 (1x256) proving and the prover/ service boot (prover/setup.sh
#     + run.sh): rabbitsnark GPU proving needs a local CUDA GPU and the local
#     GPU venv bridge; hosted runners have no GPU. The on-chain half of
#     disburse256 IS still gated here: forge test verifies the committed
#     real-proof fixtures (chains/evm/test/fixtures/disburse256.proof.json,
#     realproofs.json) against the committed Disburse256Verifier.
#   - disburse256 circuit build: 2.79M constraints -> ~1.24 GB zkey with a
#     multi-minute setup, and its only consumer is the GPU proving path
#     excluded above — nothing a hosted runner could run consumes it.
#   - live-chain deploy / smoke (the deploy scripts pointed at the live chain,
#     the deploy/live/ drivers): both need the funded deployer key from the
#     gitignored .env; this workflow is deliberately secret-free. (The local-
#     anvil mode of deploy_local.sh IS included, in the forge job.)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # PR path router for the FAST lane: each fast job runs only when its
    # inputs changed (a docs-only PR runs nothing below). Push-to-main and
    # workflow_dispatch force every output true — a filter bug can at worst
    # hide a breakage from a PR, never from main.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      contracts: ${{ steps.filter.outputs.contracts }}
      prover: ${{ steps.filter.outputs.prover }}
      indexer: ${{ steps.filter.outputs.indexer }}
      image: ${{ steps.filter.outputs.image }}
      solana: ${{ steps.filter.outputs.solana }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "$BASE"
            FILES=$(git diff --name-only "origin/$BASE...HEAD")
          else
            FILES=""
          fi
          if [ -z "$FILES" ]; then
            for k in code contracts prover indexer image solana; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          has() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }
          {
            echo "code=$(echo "$FILES" | grep -vE '^docs/|^\.dev/|\.md$|^LICENSE|^NOTICE' | grep -q . && echo true || echo false)"
            echo "contracts=$(has '^chains/evm/|^deploy/|^\.github/')"
            echo "prover=$(has '^prover/|^\.github/')"
            echo "indexer=$(has '^apps/indexer/|^chains/evm/|^packages/core/|^package(-lock)?\.json|^\.github/')"
            echo "image=$(has '^apps/indexer/|^packages/|^package(-lock)?\.json|^\.github/')"
            echo "solana=$(has '^chains/solana/|^chains/evm/test/fixtures/|^\.github/')"
          } >> "$GITHUB_OUTPUT"

  node-fast:
    needs: changes
    if: ${{ success() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: typecheck (root cross-tree)
        run: npm run typecheck
      - name: typecheck (workspaces)
        run: npm run typecheck --workspaces
      - name: core tests
        run: npm test -w @bongtu/core
      - name: ui tests
        run: npm test -w @bongtu/ui
      - name: client tests
        run: npm test -w @bongtu/client
      - name: relayer tests
        run: npm test -w @bongtu/relayer
      - name: sweeper tests
        run: npm test -w @bongtu/sweeper

  node-payroll:
    needs: changes
    if: ${{ success() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: payroll-web tests
        run: npm test -w @bongtu/payroll-web
      - name: payroll-web build
        run: npm run build -w @bongtu/payroll-web

  node-wallet:
    needs: changes
    if: ${{ success() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: wallet-web tests
        run: npm test -w @bongtu/wallet-web
      - name: wallet-web build
        run: npm run build -w @bongtu/wallet-web

  node-consumer:
    needs: changes
    if: ${{ success() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: consumer-web tests
        run: npm test -w @bongtu/consumer-web
      - name: consumer-web build
        run: npm run build -w @bongtu/consumer-web

  indexer-units:
    needs: changes
    if: ${{ success() && needs.changes.outputs.indexer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      # The ingest unit test requires ethers at module load (BONGTU_NODE_MODULES
      # seam) and parses synthetic logs with the REAL pool ABI from the forge
      # artifact — hence extdeps + a forge build in an otherwise anvil-free job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: extdeps
        with:
          path: ~/.cache/bongtu-extdeps
          key: extdeps-v1-${{ hashFiles('.github/ci-pins.env') }}
      - if: steps.extdeps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/bongtu-extdeps"
          cd "$HOME/.cache/bongtu-extdeps"
          printf '{}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            "ethers@${ETHERS_VERSION}" "snarkjs@${SNARKJS_VERSION}" "circomlib@${CIRCOMLIB_VERSION}"
      - run: echo "BONGTU_NODE_MODULES=$HOME/.cache/bongtu-extdeps/node_modules" >> "$GITHUB_ENV"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1
      - name: forge build (pool ABI artifact)
        run: forge build
        working-directory: chains/evm
      - name: committed indexer ABI matches the rebuilt pool (drift gate)
        # apps/indexer/abi/BongtuPool.abi.json is the container's committed copy of
        # the pool ABI (the Docker image ships it, since forge is not in the image
        # build). Its ONLY runtime consumer is the image, which hosted CI never
        # runs — so regenerate the slice from the fresh forge artifact here and diff.
        # A non-empty diff means the pool's events/view fns changed without the
        # committed ABI being refreshed (recipe: apps/indexer/abi/README.md).
        run: |
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("chains/evm/out/BongtuPool.sol/BongtuPool.json","utf8"));fs.writeFileSync("apps/indexer/abi/BongtuPool.abi.json",JSON.stringify({abi:a.abi},null,2)+"\n")'
          git diff --exit-code apps/indexer/abi/BongtuPool.abi.json
      - name: indexer unit tests (tree + disclosure + ingest, anvil-free)
        run: npm run test:unit -w @bongtu/indexer

  indexer-image:
    # BUILD-ONLY: prove apps/indexer/Dockerfile builds on a clean hosted runner.
    # `docker compose up` + the pg integration test (apps/indexer/test/
    # pg_integration.sh) are LOCAL gates — they need a live RPC, a deployed pool,
    # and CPU proofs, so they are deliberately NOT run here (see the header note).
    needs: changes
    if: ${{ success() && needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        # Pin the image's externally-loaded ethers to the single source of truth
        # (ETHERS_VERSION), the same way every other job resolves extdeps.
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - name: docker build (indexer image, build-only)
        run: |
          docker build \
            -f apps/indexer/Dockerfile \
            --build-arg ETHERS_VERSION="$ETHERS_VERSION" \
            -t bongtu-indexer:ci .

  forge:
    needs: changes
    if: ${{ success() && needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1
      - name: forge test
        run: forge test -vv
        working-directory: chains/evm
      - name: local deploy + smoke gate (deploy_local.sh, self-contained anvil :8550)
        # The only gate exercising Deploy.s.sol/Smoke.s.sol wiring (proxy init,
        # verifier wiring, addresses round-trip); deployer = anvil account 0.
        run: bash deploy/gates/deploy_local.sh

  solana-mollusk:
    # chains/solana/ program island (SOLR §3.1.3): cargo-build-sbf + the mollusk
    # gates (poseidon conformance, verify parity vs committed EVM realproof
    # fixtures, invariant-gate conformance, CU budget). Self-contained: the
    # pinned Agave release ships cargo-build-sbf + platform-tools, the host
    # toolchain comes from chains/solana/rust-toolchain.toml via rustup, and every
    # fixture/vector is committed — no network beyond toolchain install.
    needs: changes
    if: ${{ success() && needs.changes.outputs.solana == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - name: install Agave toolchain (AGAVE_VERSION pin in ci-pins.env)
        # TODO: sha256-pin the installer download (the ptau/circom checksum
        # precedent in ci-pins.env); no local artifact of the installer exists
        # to hash offline, so the pin is version-only for now.
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            chains/solana/target
          key: solana-cargo-${{ runner.os }}-${{ env.AGAVE_VERSION }}-${{ hashFiles('chains/solana/Cargo.lock', 'chains/solana/rust-toolchain.toml') }}
      - name: mollusk gates
        run: bash chains/solana/gates/mollusk.sh

  prover-pytest:
    needs: changes
    if: ${{ success() && needs.changes.outputs.prover == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install test deps (dev-venv snapshot as of 2026-07)
        run: pip install pydantic==2.13.4 pytest==9.0.3
      - name: pytest
        run: python -m pytest
        working-directory: prover

  circuits:
    # HEAVY LANE: main pushes, manual dispatch, and PRs labeled ci:heavy.
    # Measured: warm e2e is ~3min, but any packages/core change re-keys the
    # artifact cache into a ~12-min rebuild — the lane cannot fit the 5-min
    # PR budget. Post-merge main runs stay unfiltered.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - name: compute artifact cache key
        id: key
        # The key must cover everything that decides what circuits/out CONTAINS —
        # including the witness INPUTS. The generators (circuits/fixtures/gen_*.ts,
        # fixture_lib.ts) and the @bongtu/core primitives they build notes with
        # produce the committed inputs/*.json that the soundness gates below
        # consume, so a change there with unchanged .circom sources would
        # otherwise hit a stale cache and skip both the rebuild and those gates.
        run: echo "key=circuits-out-v1-${{ hashFiles('.github/ci-pins.env', 'circuits/**/*.circom', 'circuits/lib/**', 'circuits/build/prove_all.sh', 'circuits/fixtures/gen_*.ts', 'circuits/fixtures/fixture_lib.ts', 'packages/core/src/**') }}" >> "$GITHUB_OUTPUT"
      - name: check for cached circuits/out (lookup only — dependents restore it)
        id: outcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: circuits/out
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # ---- everything below runs ONLY when the artifact cache is missing ----

      - if: steps.outcache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - if: steps.outcache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.outcache.outputs.cache-hit != 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: circom (pinned release binary)
        if: steps.outcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/circom" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          echo "${CIRCOM_SHA256}  $RUNNER_TEMP/circom" | sha256sum -c
          chmod +x "$RUNNER_TEMP/circom"
          echo "CIRCOM=$RUNNER_TEMP/circom" >> "$GITHUB_ENV"

      - name: external node deps (ethers v5 + snarkjs + circomlib, pinned — not repo deps)
        if: steps.outcache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: extdeps
        with:
          path: ~/.cache/bongtu-extdeps
          key: extdeps-v1-${{ hashFiles('.github/ci-pins.env') }}
      - if: steps.outcache.outputs.cache-hit != 'true' && steps.extdeps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/bongtu-extdeps"
          cd "$HOME/.cache/bongtu-extdeps"
          printf '{}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            "ethers@${ETHERS_VERSION}" "snarkjs@${SNARKJS_VERSION}" "circomlib@${CIRCOMLIB_VERSION}"
      - if: steps.outcache.outputs.cache-hit != 'true'
        run: echo "BONGTU_NODE_MODULES=$HOME/.cache/bongtu-extdeps/node_modules" >> "$GITHUB_ENV"

      - name: pinned zeto checkout (upstream circuit sub-checks, resolved via -l)
        # Upstream zeto circuits include circomlib as "node_modules/circomlib/…",
        # so circomlib must sit at $ZETO/node_modules — symlink the pinned
        # extdeps install there (must run after the extdeps step above).
        if: steps.outcache.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/zeto"
          git -C "$RUNNER_TEMP/zeto" fetch -q --depth 1 \
            https://github.com/hyperledger-labs/zeto.git "$ZETO_SHA"
          git -C "$RUNNER_TEMP/zeto" checkout -q FETCH_HEAD
          ln -s "$HOME/.cache/bongtu-extdeps/node_modules" "$RUNNER_TEMP/zeto/zkp/circuits/node_modules"
          echo "ZETO=$RUNNER_TEMP/zeto/zkp/circuits" >> "$GITHUB_ENV"

      - name: restore pot22 ptau cache
        if: steps.outcache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bongtu-ptau
          key: ptau-powersOfTau28_hez_final_22-68a21bef

      - name: fetch + verify pot22 ptau (Hermez ceremony, 4.8 GB, sha256-pinned)
        if: steps.outcache.outputs.cache-hit != 'true'
        run: |
          PTAU_FILE="$HOME/.cache/bongtu-ptau/powersOfTau28_hez_final_22.ptau"
          mkdir -p "$(dirname "$PTAU_FILE")"
          [ -f "$PTAU_FILE" ] || curl -fL --retry 3 -o "$PTAU_FILE" "$PTAU_URL"
          # self-heal a truncated/corrupt cache entry: re-download once, then fail
          if ! echo "$PTAU_SHA256  $PTAU_FILE" | sha256sum -c; then
            rm -f "$PTAU_FILE"
            curl -fL --retry 3 -o "$PTAU_FILE" "$PTAU_URL"
            echo "$PTAU_SHA256  $PTAU_FILE" | sha256sum -c
          fi
          echo "PTAU=$PTAU_FILE" >> "$GITHUB_ENV"

      - name: build + CPU-prove the small circuits (build/prove_all.sh)
        if: steps.outcache.outputs.cache-hit != 'true'
        run: |
          export SNARKJS="node --max-old-space-size=6144 $BONGTU_NODE_MODULES/.bin/snarkjs"
          cd circuits && bash build/prove_all.sh

      - name: committed verifiers match the rebuilt ones (drift gate)
        # build/prove_all.sh copies fresh solidity verifiers into circuits/verifiers/;
        # a diff here means someone updated circuits without recommitting them.
        if: steps.outcache.outputs.cache-hit != 'true'
        run: git diff --exit-code circuits/verifiers

      - name: circuit soundness gates (zero-leaf belt, value belt + kemBinding, auditor decrypt)
        # The three gates that prove the security properties the product claims:
        # the zero-commitment belt makes SMT->IMT mint-from-nothing unsatisfiable
        # for all three spending circuits; the value belt + kemBinding tamper legs
        # convict a forged padded input or a re-bound envelope; the auditor gate
        # proves every hybrid envelope opens under the arbiter key material alone.
        # They run here because this is where the toolchain (pinned circom, ZETO,
        # extdeps) and a freshly built circuits/out both exist — and BEFORE the
        # cache save, so a failing build never becomes the cached artifact.
        if: steps.outcache.outputs.cache-hit != 'true'
        run: |
          bash circuits/gates/test_zero_leaf_unsat.sh
          npx tsx circuits/gates/assert_attacks_throw.ts
          npx tsx circuits/gates/auditor_decrypt_check.ts

      - name: save circuits/out artifact cache
        if: steps.outcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: circuits/out
          key: ${{ steps.key.outputs.key }}

  e2e-m0:
    needs: circuits
    if: ${{ success() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:heavy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: extdeps
        with:
          path: ~/.cache/bongtu-extdeps
          key: extdeps-v1-${{ hashFiles('.github/ci-pins.env') }}
      - if: steps.extdeps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/bongtu-extdeps"
          cd "$HOME/.cache/bongtu-extdeps"
          printf '{}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            "ethers@${ETHERS_VERSION}" "snarkjs@${SNARKJS_VERSION}" "circomlib@${CIRCOMLIB_VERSION}"
      - run: echo "BONGTU_NODE_MODULES=$HOME/.cache/bongtu-extdeps/node_modules" >> "$GITHUB_ENV"
      - name: restore circuits/out artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: circuits/out
          key: ${{ needs.circuits.outputs.key }}
          fail-on-cache-miss: true
      - name: M0 e2e gate (deposit -> disburse16 -> transfer -> withdraw, + portal + consumer legs)
        run: bash deploy/gates/e2e_m0.sh

  indexer-conformance:
    needs: circuits
    if: ${{ success() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:heavy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The indexer is Postgres-only (U-I4): the conformance gate ingests into a
    # real Postgres. Hosted runners support service containers, so the test RUNS
    # here (not skips) against this service. The password is a throwaway for the
    # job-local container, not a secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' .github/ci-pins.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nm
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: extdeps
        with:
          path: ~/.cache/bongtu-extdeps
          key: extdeps-v1-${{ hashFiles('.github/ci-pins.env') }}
      - if: steps.extdeps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/bongtu-extdeps"
          cd "$HOME/.cache/bongtu-extdeps"
          printf '{}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            "ethers@${ETHERS_VERSION}" "snarkjs@${SNARKJS_VERSION}" "circomlib@${CIRCOMLIB_VERSION}"
      - run: echo "BONGTU_NODE_MODULES=$HOME/.cache/bongtu-extdeps/node_modules" >> "$GITHUB_ENV"
      - name: restore circuits/out artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: circuits/out
          key: ${{ needs.circuits.outputs.key }}
          fail-on-cache-miss: true
      - name: indexer conformance gate (anvil scenarios incl. arbiter mode + the consumer leg)
        run: npm test -w @bongtu/indexer
