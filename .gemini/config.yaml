# Gemini Code Assist repo configuration (takes effect once the GitHub App is
# installed for this repo; the app itself is installed by an org admin).
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
# Generated artifacts, vendored code, and committed proof fixtures are not
# review targets: findings there are either noise or consensus-critical bytes
# no reviewer should suggest editing.
ignore_patterns:
  - "chains/evm/lib/forge-std/**"
  - "chains/evm/src/verifiers/**"
  - "chains/evm/test/fixtures/*.json"
  - "chains/solana/conformance/*.json"
  - "chains/solana/program/src/generated/**"
  - "package-lock.json"
