[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = true
# read ./test                  : fixtures (poseidon2.hex, realproofs.json, disburse256.*) for tests + deploy scripts
# read ./src                   : VerifierDrift.t.sol reads the shipped verifiers as text
# read ../../circuits/verifiers   : ...and the snarkjs-generated originals it must equal
# read-write ../../deploy         : forge/Deploy.s.sol writes addresses.<chainid>.json there; forge/Smoke.s.sol reads it back
fs_permissions = [
    { access = "read", path = "./test" },
    { access = "read", path = "./src" },
    { access = "read", path = "../../circuits/verifiers" },
    { access = "read-write", path = "../../deploy" },
]
# The deploy/upgrade scripts live in ../../deploy/forge (outside this project root)
# and import a sibling there — deploy/forge/AddressBook.sol, the one declaration of the
# addresses.<chainid>.json field list. solc refuses imports outside the project
# unless the directory is allow-listed.
allow_paths = ["../../deploy"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
